name: One-time finished branch cleanup (VivaNewVegas-KR-Patcher)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-completed-branches-once.yml'
permissions:
  contents: write
jobs:
  cleanup:
    if: github.repository == 'munument1/VivaNewVegas-KR-Patcher'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const targets=[{"name":"codex/nexus-release-sync","sha":"d151a11053dfbdfcd496ac017c4ec4842d4827ab","pr":3},{"name":"fix/hacking-font-grid","sha":"9bb3300b6dd6094fafcdf7168555d49a7de51661","pr":7},{"name":"fix/key-prompt-encoding","sha":"d58e1ed175068c14ce5bcbfb411795ec2e814af6","pr":8},{"name":"fix/nexus-1.0.7.4-publish","sha":"70334ba09bdc0c2293e2ee5246545c75fc18e809","pr":6},{"name":"fix/tnvse-kr-ui","sha":"1a3ac7ce560a6c49f7c591db13a8939b7467b5b5","pr":2},{"name":"fix/vnv-pretendard-font","sha":"b4698426207d28f15f1c350c2eca078066382f87","pr":5},{"name":"fix/vnv-tnvse-lossless-encoding-20261027","sha":"97e5252170d5366c15a122f7e1e4a4d9b0487bc3","pr":9},{"name":"release/v1.0.1-lightweight","sha":"68145d05f2acb31ad47e391cb6d00ddf6f8c754f","pr":1},{"name":"sst-native-backend","sha":"0ccc1b298ddc96463020a0e29e27d11bb2548228","pr":null}];
            const owner=context.repo.owner,repo=context.repo.repo;
            if(owner!=='munument1'||repo!=="VivaNewVegas-KR-Patcher"||context.ref!=='refs/heads/main')throw Error('Wrong repository or branch');
            const open=await github.paginate(github.rest.pulls.list,{owner,repo,state:'open',per_page:100});
            const blocked=new Set(open.flatMap(p=>[p.head.ref,p.base.ref]));
            let deleted=0;const skipped=[];
            for(const c of targets){
             if(c.name==='main'||c.name==='gh-pages'||blocked.has(c.name)){skipped.push(c.name+': protected by policy/open PR');continue;}
             let b;try{b=(await github.rest.repos.getBranch({owner,repo,branch:c.name})).data}catch(e){skipped.push(c.name+': branch missing');continue;}
             if(b.protected||b.commit.sha!==c.sha){skipped.push(c.name+': changed/protected');continue;}
             if(c.pr!==null){
              const p=(await github.rest.pulls.get({owner,repo,pull_number:c.pr})).data;
              if(!p.merged_at||p.base.ref!=='main'||p.head.ref!==c.name||p.head.sha!==c.sha){skipped.push(c.name+': PR changed');continue;}
             }else{
              const cmp=(await github.rest.repos.compareCommitsWithBasehead({owner,repo,basehead:'main...'+c.name})).data;
              if(cmp.ahead_by!==0){skipped.push(c.name+': unique commits');continue;}
             }
             await github.rest.git.deleteRef({owner,repo,ref:'heads/'+c.name});
             core.info('DELETED '+c.name);deleted++;
            }
            for(const s of skipped)core.warning('SKIPPED '+s);
            core.info('Finished: '+deleted+' deleted; '+skipped.length+' skipped; '+targets.length+' planned');
            await core.summary.addHeading('One-time branch cleanup').addRaw('Deleted '+deleted+' of '+targets.length+'; skipped '+skipped.length+'.').write();
