name: Validate VNV tNVSE encoding hardening
on:
  pull_request:
    paths:
      - 'tools/build_tnvse_patch.ps1'
      - 'tools/tnvse/**'
      - '.github/workflows/tnvse-encoding-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  win32-regression:
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build fresh patched Win32 tNVSE DLL
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x86 -host_arch=x64
          if errorlevel 1 exit /b 1
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\build_tnvse_patch.ps1
          if errorlevel 1 exit /b 1
          if not exist .tnvse-source\out\kr-ui-fix\bin\Release\tnvse.dll exit /b 1
      - name: Compile and execute source-level replacement regressions
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x86 -host_arch=x64
          if errorlevel 1 exit /b 1
          if not exist build mkdir build
          python tools\tnvse\replacement_regression.py .tnvse-source build\replacement-regression.cpp
          if errorlevel 1 exit /b 1
          cl /nologo /EHsc /std:c++20 /utf-8 /Febuild\replacement-regression.exe build\replacement-regression.cpp
          if errorlevel 1 exit /b 1
          build\replacement-regression.exe
          if errorlevel 1 exit /b 1
